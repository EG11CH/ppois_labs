name: Lab2 build, tests and Linux release

on:
  pull_request:
    paths: ['lab2/**', '.clang-format', 'CMakeLists.txt', '.github/workflows/lab2.yml']
  push:
    branches: ['main', 'feature/lab2-rental']
    tags: ['lab2-v*']
    paths: ['lab2/**', '.clang-format', 'CMakeLists.txt', '.github/workflows/lab2.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Install build and verification tools
        run: |
          sudo apt-get update
          sudo apt-get install -y g++ make cmake catch2 cppcheck clang-format gcovr python3 ripgrep
      - name: Check formatting and analyze production C++
        run: |
          rg --files lab2 -g '*.h' -g '*.cpp' --null | xargs -0 clang-format --dry-run --Werror
          cppcheck --enable=warning,style,performance,portability --suppress=useStlAlgorithm \
            --std=c++20 --error-exitcode=1 -I lab2/include -I lab2/cli lab2/src lab2/cli
      - name: Build, test and measure line coverage
        run: |
          cmake -S lab2 -B build-lab2 -DENABLE_COVERAGE=ON -DCMAKE_BUILD_TYPE=Debug
          cmake --build build-lab2 --parallel 2
          ctest --test-dir build-lab2 -LE '^lab2-smoke$' --output-on-failure
          python3 lab2/tools/check_coverage.py build-lab2 \
            --report-dir build-lab2/coverage-lab2-catch2
          ctest --test-dir build-lab2 -L '^lab2-smoke$' --output-on-failure
          python3 lab2/tools/check_coverage.py build-lab2
      - name: Package and test the portable binary
        run: |
          cmake -S lab2 -B build-release -DBUILD_TESTING=OFF \
            -DBUILD_PORTABLE_BINARIES=ON -DCMAKE_BUILD_TYPE=Release
          cmake --build build-release --parallel 2
          mkdir -p release/staging
          tar -czf release/lab2-linux-x86_64.tar.gz -C build-release rental_cli -C ../lab2 README.md
          tar -xzf release/lab2-linux-x86_64.tar.gz -C release/staging
          python3 lab2/tests/cli_test.py release/staging/rental_cli
      - uses: actions/upload-artifact@v6
        with:
          name: lab2-linux-x86_64
          path: release/lab2-linux-x86_64.tar.gz
          if-no-files-found: error
      - uses: actions/upload-artifact@v6
        with:
          name: lab2-coverage
          path: |
            build-lab2/coverage-lab2/
            build-lab2/coverage-lab2-catch2/
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/lab2-v')
    needs: verify
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Verify that the tag belongs to the lab2 branch or main
        run: |
          git merge-base --is-ancestor "$GITHUB_SHA" origin/feature/lab2-rental ||
            git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - uses: actions/download-artifact@v6
        with:
          name: lab2-linux-x86_64
          path: release
      - name: Publish the tested release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          archive=release/lab2-linux-x86_64.tar.gz
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "$archive" --clobber
          else
            gh release create "$RELEASE_TAG" "$archive" --verify-tag \
              --title "Лабораторная №2 — прокат инвентаря"
          fi
